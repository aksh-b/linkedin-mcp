[package]
name = "linkedin-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
