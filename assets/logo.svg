<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">linkedin-mcp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- spokes: one hub connecting three members -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="66" x2="34" y2="40"/>
    <line x1="64" y1="66" x2="94" y2="40"/>
    <line x1="64" y1="66" x2="64" y2="100"/>
  </g>
  <!-- members -->
  <g fill="#FFFFFF">
    <circle cx="34" cy="40" r="13"/>
    <circle cx="94" cy="40" r="13"/>
    <circle cx="64" cy="100" r="13"/>
  </g>
  <!-- hub (the MCP server), Rust orange -->
  <circle cx="64" cy="66" r="15" fill="#F97316" stroke="#FFFFFF" stroke-width="5"/>
</svg>
